<!DOCTYPE html>

<html class="light" lang="en">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Login - Rental Smart Room Management</title>
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
		rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
		rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
		rel="stylesheet" />
	<script id="tailwind-config">
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					"colors": {
						"on-tertiary": "#ffffff",
						"secondary-fixed-dim": "#4ae176",
						"primary-fixed-dim": "#c3c0ff",
						"on-primary": "#ffffff",
						"tertiary-fixed": "#ffddb8",
						"primary-fixed": "#e2dfff",
						"on-secondary-fixed-variant": "#005321",
						"on-secondary-fixed": "#002109",
						"error-container": "#ffdad6",
						"on-error": "#ffffff",
						"background": "#f8f9ff",
						"on-secondary-container": "#007432",
						"surface-container-lowest": "#ffffff",
						"on-background": "#0b1c30",
						"surface-dim": "#cbdbf5",
						"surface-container-low": "#eff4ff",
						"on-surface-variant": "#464555",
						"outline-variant": "#c7c4d8",
						"tertiary-fixed-dim": "#ffb95f",
						"surface-container-highest": "#d3e4fe",
						"on-tertiary-container": "#ffd4a4",
						"inverse-on-surface": "#eaf1ff",
						"inverse-surface": "#213145",
						"on-error-container": "#93000a",
						"error": "#ba1a1a",
						"surface-bright": "#f8f9ff",
						"on-surface": "#0b1c30",
						"on-tertiary-fixed-variant": "#653e00",
						"tertiary": "#684000",
						"primary": "#3525cd",
						"primary-container": "#4f46e5",
						"outline": "#777587",
						"tertiary-container": "#885500",
						"inverse-primary": "#c3c0ff",
						"secondary-fixed": "#6bff8f",
						"surface-tint": "#4d44e3",
						"on-primary-container": "#dad7ff",
						"secondary": "#006e2f",
						"surface-container-high": "#dce9ff",
						"on-secondary": "#ffffff",
						"surface-container": "#e5eeff",
						"surface-variant": "#d3e4fe",
						"on-primary-fixed": "#0f0069",
						"surface": "#f8f9ff",
						"secondary-container": "#6bff8f",
						"on-primary-fixed-variant": "#3323cc",
						"on-tertiary-fixed": "#2a1700"
					},
					"borderRadius": {
						"DEFAULT": "0.25rem",
						"lg": "0.5rem",
						"xl": "0.75rem",
						"full": "9999px"
					},
					"spacing": {
						"margin-mobile": "20px",
						"xs": "4px",
						"xl": "32px",
						"md": "16px",
						"sm": "8px",
						"unit": "4px",
						"lg": "24px",
						"gutter": "16px"
					},
					"fontFamily": {
						"display-lg": ["Inter"],
						"sensor-value": ["Inter"],
						"body-lg": ["Inter"],
						"headline-md": ["Inter"],
						"headline-lg": ["Inter"],
						"body-md": ["Inter"],
						"label-md": ["Inter"]
					},
					"fontSize": {
						"display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
						"sensor-value": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
						"body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
						"headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
						"headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

				},
			},
		}
	</script>
	<style>
		.material-symbols-outlined {
			font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
			display: inline-block;
			line-height: 1;
			text-transform: none;
			letter-spacing: normal;
			word-wrap: normal;
			white-space: nowrap;
			direction: ltr;
		}

		.loading-overlay {
			display: none;
			backdrop-filter: blur(8px);
		}

		.loading-overlay.active {
			display: flex;
		}

		@keyframes spin-custom {
			to {
				transform: rotate(360deg);
			}
		}

		.animate-spin-custom {
			animation: spin-custom 1s linear infinite;
		}
	</style>
	<style>
		body {
			min-height: max(884px, 100dvh);
		}
	</style>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
	<!-- Brand Header Section -->
	<header class="w-full flex justify-center pt-xl pb-lg">
		<div class="flex items-center gap-sm">
			<div
				class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center text-on-primary-container">
				<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">apartment</span>
			</div>
			<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-primary">
				My Room
			</h1>
		</div>
	</header>
	<!-- Main Content Canvas -->
	<main class="flex-grow flex items-center justify-center px-margin-mobile pb-xl">
		<div
			class="w-full max-w-md bg-surface-container-lowest rounded-xl p-lg shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30">
			<div class="mb-lg text-center">
				<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Welcome Back</h2>
				<p class="font-body-md text-on-surface-variant">Sign in to manage your smart residence</p>
			</div>
			<form class="space-y-md" id="loginForm">
				<!-- Username Input -->
				<div class="space-y-xs">
					<label class="font-label-md text-label-md text-on-surface-variant block px-1"
						for="username">Username</label>
					<div class="relative group">
						<span
							class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
						<input
							class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-body-md placeholder:text-outline transition-all"
							id="username" name="username" placeholder="Enter your username" required="" type="text" />
					</div>
				</div>
				<!-- Password Input -->
				<div class="space-y-xs">
					<div class="flex justify-between items-center px-1">
						<label class="font-label-md text-label-md text-on-surface-variant"
							for="password">Password</label>
						<a class="text-label-md text-primary font-semibold hover:underline" href="#">Forgot?</a>
					</div>
					<div class="relative group">
						<span
							class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
						<input
							class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-body-md placeholder:text-outline transition-all"
							id="password" name="password" placeholder="••••••••" required="" type="password" />
					</div>
				</div>
				<!-- Remember Me -->
				<div class="flex items-center gap-sm px-1 py-1">
					<input
						class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-low"
						id="remember" type="checkbox" />
					<label class="font-body-md text-on-surface-variant select-none" for="remember">Remember this
						device</label>
				</div>
				<!-- Primary Action -->
				<button
					class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm mt-lg"
					type="submit">
					Login
					<span class="material-symbols-outlined">arrow_forward</span>
				</button>
			</form>
			<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
				<p class="font-label-md text-label-md text-on-surface-variant flex items-center justify-center gap-xs">
					<span class="material-symbols-outlined text-[16px]"
						style="font-variation-settings: 'FILL' 1;">security</span>
					Secure, encrypted management portal
				</p>
			</div>
		</div>
	</main>
	<!-- Visual Background Element -->
	<div class="fixed bottom-0 left-0 w-full h-[353px] -z-10 opacity-40 pointer-events-none overflow-hidden">
		<img class="w-full h-full object-cover blur-3xl scale-110"
			data-alt="A clean, wide-angle architectural shot of a modern, minimalist smart apartment building exterior at twilight. The structure features large glass windows emitting a soft, warm indigo and white glow, contrasted against a crisp, cool evening sky. The overall aesthetic is professional and high-end, focusing on themes of security, comfort, and advanced technology within a residential context."
			src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyi3Gr6j1xqrAon3_7mvZMEQjPNYFP5Wxdhf29_7MDXq-OJyIEsazQMutdpKmaQuTWwcvU4CLFtDxddAugicS7PamSjLqFFRI84UPpdNscZtJMuxZZFZDV5b0IQwK0e3xzhzqjtgVMzi424PcFh21YoduJuSugbWTiqQF2qR2muVVdALAOX3yhufrelT9DAjxN84f0J0RWhRRykK9ussp6m94cmGAT_3tehkFU2Kvcp2jxLA_5XkagL-tCXLmLTTz-dGTueOdf6uo" />
	</div>
	<!-- Authenticating Overlay -->
	<div class="loading-overlay fixed inset-0 z-50 flex-col items-center justify-center bg-background/60"
		id="loadingOverlay">
		<div
			class="bg-surface-container-lowest p-xl rounded-2xl shadow-xl flex flex-col items-center gap-md border border-outline-variant/20">
			<div class="relative w-16 h-16">
				<div class="absolute inset-0 border-4 border-primary-container/20 rounded-full"></div>
				<div
					class="absolute inset-0 border-4 border-primary border-t-transparent rounded-full animate-spin-custom">
				</div>
			</div>
			<div class="text-center">
				<p class="font-headline-md text-headline-md text-on-surface">Authenticating...</p>
				<p class="font-body-md text-on-surface-variant">Connecting to secure server</p>
			</div>
		</div>
	</div>
	<script>
		document.getElementById('loginForm').addEventListener('submit', function (e) {
			e.preventDefault();
			const overlay = document.getElementById('loadingOverlay');
			overlay.classList.add('active');

			// Simulate authentication delay
			setTimeout(() => {
				// For demonstration, we just reset or could redirect
				// In a real app: window.location.href = '/dashboard';
				overlay.classList.remove('active');
				alert('Authentication successful! (Simulation)');
			}, 2500);
		});

		// Soft interaction feedback for inputs
		const inputs = document.querySelectorAll('input');
		inputs.forEach(input => {
			input.addEventListener('focus', () => {
				input.parentElement.closest('.group')?.classList.add('scale-[1.01]');
			});
			input.addEventListener('blur', () => {
				input.parentElement.closest('.group')?.classList.remove('scale-[1.01]');
			});
		});
	</script>
</body>

</html>
