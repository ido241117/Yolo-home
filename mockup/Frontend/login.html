<!DOCTYPE html>

<html class="dark" lang="en">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Login | Rental Smart Room</title>
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
		rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
		rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
		rel="stylesheet" />
	<script id="tailwind-config">
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					"colors": {
						"secondary": "#b9c7e0",
						"on-secondary-fixed": "#0d1c2f",
						"on-tertiary": "#571f00",
						"primary-fixed-dim": "#c3c0ff",
						"surface-container-lowest": "#060e20",
						"surface-variant": "#2d3449",
						"error-container": "#93000a",
						"on-tertiary-container": "#ffd2be",
						"primary": "#c3c0ff",
						"outline-variant": "#464555",
						"on-background": "#dae2fd",
						"on-tertiary-fixed-variant": "#7b2f00",
						"tertiary-fixed-dim": "#ffb695",
						"secondary-fixed-dim": "#b9c7e0",
						"secondary-fixed": "#d5e3fd",
						"surface-container": "#171f33",
						"surface-container-low": "#131b2e",
						"inverse-surface": "#dae2fd",
						"surface-container-high": "#222a3d",
						"secondary-container": "#3c4a5e",
						"on-tertiary-fixed": "#351000",
						"surface-bright": "#31394d",
						"surface": "#0b1326",
						"on-primary-fixed": "#0f0069",
						"on-primary-container": "#dad7ff",
						"tertiary-container": "#a44100",
						"on-error": "#690005",
						"primary-container": "#4f46e5",
						"inverse-primary": "#4d44e3",
						"on-surface-variant": "#c7c4d8",
						"surface-tint": "#c3c0ff",
						"surface-dim": "#0b1326",
						"on-secondary-fixed-variant": "#3a485c",
						"on-primary-fixed-variant": "#3323cc",
						"on-secondary": "#233144",
						"error": "#ffb4ab",
						"on-secondary-container": "#abb9d2",
						"surface-container-highest": "#2d3449",
						"background": "#0b1326",
						"tertiary": "#ffb695",
						"on-surface": "#dae2fd",
						"on-error-container": "#ffdad6",
						"primary-fixed": "#e2dfff",
						"on-primary": "#1d00a5",
						"outline": "#918fa1",
						"tertiary-fixed": "#ffdbcc",
						"inverse-on-surface": "#283044"
					},
					"borderRadius": {
						"DEFAULT": "0.125rem",
						"lg": "0.25rem",
						"xl": "0.5rem",
						"full": "0.75rem"
					},
					"spacing": {
						"stack_gap_md": "16px",
						"stack_gap_lg": "24px",
						"stack_gap_sm": "8px",
						"container_gutter": "24px",
						"unit": "4px",
						"card_padding": "16px",
						"sidebar_width": "240px"
					},
					"fontFamily": {
						"headline-lg": ["Inter"],
						"display": ["Inter"],
						"headline-md": ["Inter"],
						"body-lg": ["Inter"],
						"body-md": ["Inter"],
						"headline-sm": ["Inter"],
						"label-sm": ["Inter"],
						"label-md": ["Inter"],
						"headline-lg-mobile": ["Inter"]
					},
					"fontSize": {
						"headline-lg": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
						"display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
						"headline-md": ["20px", { "lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "600" }],
						"body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
						"body-md": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
						"headline-sm": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "500" }],
						"label-sm": ["11px", { "lineHeight": "1", "letterSpacing": "0", "fontWeight": "400" }],
						"label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
						"headline-lg-mobile": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }]
					}
				},
			},
		}
	</script>
	<style>
		body {
			background-color: #0b1326;
			/* Using background color from config */
			font-family: 'Inter', sans-serif;
		}

		.material-symbols-outlined {
			font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
		}

		.glass-background {
			background: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b1326 100%);
		}

		.login-card {
			background-color: #171f33;
			/* surface-container */
			border: 1px solid #334155;
			/* outline-variant style border */
		}

		.input-glow:focus {
			box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
		}
	</style>
</head>

<body class="flex items-center justify-center min-h-screen p-container_gutter overflow-hidden glass-background">
	<!-- Atmospheric Micro-interactions Script -->
	<script>
		document.addEventListener('mousemove', (e) => {
			const bg = document.body;
			const x = e.clientX / window.innerWidth;
			const y = e.clientY / window.innerHeight;
			bg.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, #1e293b 0%, #0b1326 100%)`;
		});
	</script>
	<!-- Main Login Container -->
	<main class="w-full max-w-[440px] z-10">
		<!-- Brand Header (Prioritizing Design System Typography) -->
		<div class="flex flex-col items-center mb-stack_gap_lg">
			<div
				class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-stack_gap_md shadow-xl">
				<span class="material-symbols-outlined text-on-primary-container text-[28px]"
					data-icon="meeting_room">meeting_room</span>
			</div>
			<h1 class="text-on-surface font-headline-lg text-headline-lg text-center">Rental Smart Room</h1>
			<p class="text-on-surface-variant font-body-md text-body-md text-center mt-2 opacity-80">IoT Management
				Interface</p>
		</div>
		<!-- Login Card -->
		<section class="login-card p-10 rounded-xl shadow-2xl relative overflow-hidden">
			<!-- Subtle accent bar -->
			<div class="absolute top-0 left-0 w-full h-[2px] bg-primary-container"></div>
			<form class="space-y-stack_gap_lg" onsubmit="return false;">
				<!-- Username Field -->
				<div class="space-y-stack_gap_sm">
					<label class="text-on-surface-variant font-label-md text-label-md block uppercase tracking-wider"
						for="username">Username</label>
					<div class="relative">
						<span
							class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]"
							data-icon="person">person</span>
						<input
							class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg py-3 pl-11 pr-4 font-body-md text-body-md focus:outline-none focus:border-primary-container input-glow transition-all placeholder:text-outline-variant"
							id="username" placeholder="admin_user" type="text" />
					</div>
				</div>
				<!-- Password Field -->
				<div class="space-y-stack_gap_sm">
					<div class="flex justify-between items-end">
						<label
							class="text-on-surface-variant font-label-md text-label-md block uppercase tracking-wider"
							for="password">Password</label>
						<a class="text-primary font-label-md text-label-md hover:underline" href="#">Forgot
							password?</a>
					</div>
					<div class="relative">
						<span
							class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]"
							data-icon="lock">lock</span>
						<input
							class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg py-3 pl-11 pr-4 font-body-md text-body-md focus:outline-none focus:border-primary-container input-glow transition-all placeholder:text-outline-variant"
							id="password" placeholder="••••••••" type="password" />
					</div>
				</div>
				<!-- Remember Me Toggle -->
				<div class="flex items-center gap-2">
					<input
						class="w-4 h-4 rounded border-outline-variant bg-surface-container-lowest text-primary-container focus:ring-primary-container focus:ring-offset-surface"
						id="remember" type="checkbox" />
					<label class="text-on-surface-variant font-body-md text-body-md cursor-pointer select-none"
						for="remember">Stay signed in for 30 days</label>
				</div>
				<!-- Submit Button -->
				<button
					class="w-full bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] text-white font-headline-sm text-headline-sm py-4 rounded-lg shadow-lg shadow-primary-container/20 transition-all flex items-center justify-center gap-2"
					type="submit">
					<span>Secure Access</span>
					<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
				</button>
			</form>
			<!-- Card Footer -->
			<div class="mt-stack_gap_lg pt-stack_gap_lg border-t border-outline-variant/30 text-center">
				<p class="text-on-surface-variant font-label-md text-label-md">
					Need technical assistance? <a class="text-primary hover:underline" href="#">Contact Support</a>
				</p>
			</div>
		</section>
		<!-- Dynamic Security Indicator -->
		<div class="mt-8 flex items-center justify-center gap-4 text-outline">
			<div class="flex items-center gap-1.5 opacity-60">
				<span class="material-symbols-outlined text-[16px]" data-icon="shield">shield</span>
				<span class="font-label-sm text-label-sm">256-bit Encryption</span>
			</div>
			<div class="w-1 h-1 rounded-full bg-outline-variant opacity-60"></div>
			<div class="flex items-center gap-1.5 opacity-60">
				<span class="material-symbols-outlined text-[16px]" data-icon="sync">sync</span>
				<span class="font-label-sm text-label-sm">System Ready</span>
			</div>
		</div>
	</main>
	<!-- Background Decorative Elements (Linear Style) -->
	<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
		<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/5 blur-[120px] rounded-full">
		</div>
		<div
			class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-tertiary-container/5 blur-[120px] rounded-full">
		</div>
		<!-- Subtle Grid Pattern -->
		<div class="absolute inset-0 opacity-[0.03]"
			style="background-image: linear-gradient(#918fa1 1px, transparent 1px), linear-gradient(90deg, #918fa1 1px, transparent 1px); background-size: 48px 48px;">
		</div>
	</div>
</body>

</html>
